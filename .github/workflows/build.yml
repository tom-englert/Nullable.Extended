name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SOLUTION: src/Nullable.Extended.sln
  BUILD_CONFIGURATION: Release
  DeployExtension: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        continue-on-error: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild "${{ env.SOLUTION }}" -restore -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:Platform="Any CPU"

      - name: Test
        run: dotnet test --solution "${{ env.SOLUTION }}" --no-build --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: src/**/${{ env.BUILD_CONFIGURATION }}/*.nupkg

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: Vsix
          path: src/**/${{ env.BUILD_CONFIGURATION }}/**/*.vsix

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest  

    steps:
    - uses: actions/checkout@v7

    - name: Verify tag matches version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content src\Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        $tag = '${{ github.ref_name }}' -replace '^v', ''
        if (-not $version) { throw 'Version not found in Directory.Build.props' }
        if ($tag -ne $version) { throw "Tag '$tag' does not match version '$version' in Directory.Build.props" }
        "PackageVersion=$version" >> $env:GITHUB_ENV

  publish_nuget:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: Package
          path: packages

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: tom-englert

      - name: Push to nuget.org
        run: dotnet nuget push "packages/**/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $notes = @()
          $found = $false
          foreach ($line in Get-Content RelaseNotes.md) {
            if ($line.Trim() -match '^\d+(\.\d+)*$') {
              if ($found) { break }
              if ($line.Trim() -eq $tag) { $found = $true }
              continue
            }
            if ($found) { $notes += $line }
          }
          ($notes -join "`n").Trim() | Set-Content release-notes.txt

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.txt
          files: |
            artifacts/Package/*.nupkg
            artifacts/Vsix/*.vsix

  publish_vsixgallery:
    needs: publish
    name: Publish to Open VSIX Gallery
    runs-on: ubuntu-latest
    env:
      repoUrl: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Vsix
          path: vsix

      - name: Publish to Open VSIX Gallery
        shell: pwsh
        run: |
          Get-ChildItem vsix -Filter *.vsix -Recurse | ForEach-Object {
            curl.exe -L "https://www.vsixgallery.com/api/upload?repo=$env:repoUrl&issuetracker=$env:repoUrl/issues" -F "file=@`"$($_.FullName)`""
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  publish_marketplace:
    needs: publish
    name: Publish to Marketplace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Vsix
          path: vsix

      - name: Locate VSIX
        shell: pwsh
        run: |
          $vsix = Get-ChildItem vsix -Filter *.vsix -Recurse | Select-Object -First 1
          if (-not $vsix) { throw 'No vsix found' }
          "VSIX_FILE=$($vsix.FullName)" >> $env:GITHUB_ENV

      - name: Publish to Marketplace
        uses: cezarypiatek/VsixPublisherAction@1.2
        with:
          extension-file: ${{ env.VSIX_FILE }}
          publish-manifest-file: vs-publish.json
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}


