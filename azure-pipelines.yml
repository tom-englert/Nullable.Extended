pool:
  vmImage: 'windows-latest'

variables:
  solution: 'src/Nullable.Extended.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: VSBuild@1
  displayName: Build
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    msbuildArgs: '-restore'
  env:
    DeployExtension: False  

- script: dotnet test --solution $(solution) --no-build --configuration $(buildConfiguration)
  displayName: Test

- task: CopyFiles@2
  inputs:
    SourceFolder: 'src'
    Contents: '**\$(buildConfiguration)\*.nupkg'
    TargetFolder: '$(Build.ArtifactStagingDirectory)\Nuget'
    flattenFolders: true

- task: CopyFiles@2
  inputs:
    SourceFolder: 'src'
    Contents: '**\$(buildConfiguration)\**\*.vsix'
    TargetFolder: '$(Build.ArtifactStagingDirectory)\Vsix'
    flattenFolders: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\Nuget'
    ArtifactName: 'Package'
    publishLocation: 'Container'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\Vsix'
    ArtifactName: 'Vsix'
    publishLocation: 'Container'
